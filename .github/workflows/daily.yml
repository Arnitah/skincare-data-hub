name: Daily data refresh

on:
  schedule:
    - cron: "17 9 * * *"     # every day 09:17 UTC (05:17 Toronto)
  push:                      # re-run when the scrapers or source list change
    branches: [main]
    paths: ["hub/**", "sources.yaml", "requirements.txt", ".github/workflows/daily.yml"]
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated source ids to run (blank = all active)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch sources and rebuild tables
        id: run
        continue-on-error: true
        run: python -m hub.run --only "${{ github.event.inputs.only || '' }}"

      - name: Commit updated data
        run: |
          git config user.name  "skincare-data-hub bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs state
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Data refresh $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi

      - name: Fail the job if every source failed
        if: steps.run.outcome == 'failure'
        run: exit 1
